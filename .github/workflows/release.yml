name: Release

# Turns a pushed version tag into a GitHub release, with the notes taken
# straight from CHANGELOG.md so the two can never drift apart.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Build release notes from CHANGELOG.md
        run: |
          ruby script/changelog_section.rb "${GITHUB_REF_NAME#v}" > release-notes.md
          cat release-notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in *[a-zA-Z]*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            $prerelease
